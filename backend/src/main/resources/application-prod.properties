spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# The checked-in initializer only creates missing tables. Hibernate then validates
# the resulting schema and fails startup if an existing table is incompatible.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__initial_schema.sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:20}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:2}
server.forward-headers-strategy=framework
server.error.include-message=never

groq.api.base-url=${GROQ_API_BASE_URL:https://api.groq.com/openai/v1}
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.connect-timeout-ms=${GROQ_CONNECT_TIMEOUT_MS:3000}
groq.read-timeout-ms=${GROQ_READ_TIMEOUT_MS:45000}
