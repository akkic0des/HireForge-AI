spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never

groq.api.base-url=${GROQ_API_BASE_URL:https://api.groq.com/openai/v1}
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.connect-timeout-ms=${GROQ_CONNECT_TIMEOUT_MS:3000}
groq.read-timeout-ms=${GROQ_READ_TIMEOUT_MS:45000}
