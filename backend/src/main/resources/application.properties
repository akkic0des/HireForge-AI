app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
spring.application.name=hireforge-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hireforge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

groq.api.base-url=${GROQ_API_BASE_URL:https://api.groq.com/openai/v1}
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.connect-timeout-ms=${GROQ_CONNECT_TIMEOUT_MS:3000}
groq.read-timeout-ms=${GROQ_READ_TIMEOUT_MS:45000}




